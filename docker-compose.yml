# Backend (FastAPI, port 8000) and front end (Streamlit, port 8501) from one image.
# Without ANTHROPIC_API_KEY the backend answers with a fixed demo report (header X-Demo-Data: true).
services:
  api:
    build: .
    container_name: truthengine-api
    env_file:
      - path: .env
        required: false
    environment:
      PUBLIC_API_URL: http://localhost:8000
      KNOWLEDGE_DIR: /app/data/knowledge
    ports:
      - "8000:8000"
    volumes:
      - knowledge:/app/data/knowledge

  ui:
    build: .
    container_name: truthengine-ui
    command: ["streamlit", "run", "app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      API_URL: http://api:8000          # server-to-server, inside the Docker network
      PUBLIC_API_URL: http://localhost:8000   # links opened by the browser
    depends_on:
      - api
    ports:
      - "8501:8501"

volumes:
  knowledge:
